[project]
name = "into-the-grape-vine"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "dropbox>=11.36.0,<12.0.0",
    "fastapi>=0.115.0",
    "openpyxl>=3.1.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "setuptools==68.0.0",
    "uvicorn>=0.32.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ANN"]

# Use public PyPI so the lockfile works on any machine,
# not only machines with access to a private package mirror.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
